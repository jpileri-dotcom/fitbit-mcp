app = "fitbit-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_URL = "https://fitbit-mcp.fly.dev"
  DATA_DIR = "/data"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "fitbit_data"
  destination = "/data"
